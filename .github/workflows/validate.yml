name: Validate customer plugin

on:
    pull_request:
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    validate:
        name: Validate plugin
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
              with:
                  python-version: "3.13"
            - name: Validate package and API helper
              run: |
                  python3 scripts/validate_package.py
                  python3 -m unittest discover -s tests -v
            - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
              with:
                  node-version: "22"
            - name: Validate with pinned Claude Code CLI
              run: |
                  npm install --global @anthropic-ai/claude-code@2.1.267
                  claude plugin validate . --strict
                  claude plugin validate ./plugins/ghost --strict
                  claude plugin validate ./plugins/ghost/skills --strict
            - name: Scan package and history for secrets
              run: |
                  curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz --output "$RUNNER_TEMP/gitleaks.tar.gz"
                  echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict
                  tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
                  "$RUNNER_TEMP/gitleaks" git --redact --config .gitleaks.toml --log-opts="--all" .
                  "$RUNNER_TEMP/gitleaks" dir --redact --config .gitleaks.toml .
